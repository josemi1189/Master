name: CI Modulo 6
on:
  push:
    branches: main
    paths:
      - "Modulo_6/**"

  pull_request:
    paths:
      - "Modulo_6/**"

# https://docs.github.com/es/actions/how-tos/write-workflows/choose-what-workflows-do/set-default-values-for-jobs
jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Modulo_6
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test -- --run

  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Modulo_6
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install dependencies
        run: npm ci

      - name: Test e2e
        run: npm run test:e2e:ci
