name: CI Workflow
on: pull_request
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/Checkout@v7

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/Checkout@v7
      - name: Install dependencies
        run: npm ci
      - name: Test e2e
        run: npm run test:e2e:ci
